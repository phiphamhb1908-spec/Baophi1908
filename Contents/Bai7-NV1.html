<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Góp ý thư viện</title>
</head>
<body>

<h2>Đóng góp ý kiến cho thư viện của nhà trường</h2>

<form action="ketqua.html">

    <h3>1. Thông tin về người góp ý</h3>

    Họ và tên: <br>
    <input type="text" name="hoten"><br><br>

    Địa chỉ email: <br>
    <input type="text" name="email"><br><br>

    <h3>2. Nội dung góp ý</h3>

    Ý kiến đóng góp: <br>
    <textarea rows="6" cols="40" name="ykien"></textarea><br><br>

    <h3>3. Thể loại cần bổ sung thêm sách</h3>

    <input type="checkbox" name="truyengan"> Truyện ngắn <br>
    <input type="checkbox" name="kynangsong"> Kĩ năng sống <br>
    <input type="checkbox" name="cntt"> Công nghệ thông tin <br>
    <input type="checkbox" name="truyentranh"> Truyện tranh <br>
    <input type="checkbox" name="lichsu"> Lịch sử <br><br>

    <input type="submit" value="Góp ý">

</form>

</body>
</html>
